solana_mobile_dapp_publisher_portal:
  google_store_package: ''
  testing_instructions: |
    1. Open the app and connect a Solana wallet (Phantom recommended)
    2. Tap "Top Up" to deposit 0.05 SOL for 5 play credits
    3. Tap "Play" to enter random matchmaking queue
    4. Once matched, hold your phone still during the standoff screen
    5. When the phone vibrates, tap as fast as possible
    6. Fastest valid tap wins the pot (0.019 SOL after 5% rake)
    Alternative: Use "Challenge Friend" to create a room with a 6-character invite code
    Note: You can test against the built-in bot by enabling bot mode in matchmaking
