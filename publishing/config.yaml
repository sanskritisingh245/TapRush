  catalog:
    en-US:
      name: TapRush
      short_description: Quick-draw duel game on Solana
      long_description: |
        TapRush (SnapDuel) is a mobile-only quick-draw betting game built on Solana.

        HOW IT WORKS:
        - Two players wager SOL and enter a standoff screen
        - After a random delay (2-15 seconds), both phones vibrate simultaneously
        - The first player to tap AFTER the vibration wins the pot
        - Tap BEFORE the vibration = instant forfeit
        - Winner takes all (minus 5% rake)

        FEATURES:
        - Real SOL wagering via Solana blockchain
        - Credit-based system (1 top-up = 5 plays)
        - Random matchmaking or challenge friends with invite codes
        - Anti-cheat: latency-compensated reaction timing
        - ELO leaderboard and achievement system
        - Tier progression: Bronze > Silver > Gold > Diamond > Phantom
        - Daily challenges for bonus credits and XP
        - Bot practice mode for new players

        Built with Solana, Anchor, Expo (React Native).
      new_in_version: Initial release - quick-draw duels with SOL wagering, matchmaking, leaderboards, and achievements.
